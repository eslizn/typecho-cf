packages:
  - '.'
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  js-yaml: 4.3.2
  nanoid: 3.3.20
  sharp: 0.35.5
  svgo: 4.1.0
  undici@7: 7.30.2
  undici@8: 8.12.4
  # minimatch 10 has no release fixing the globparts amplification advisory.
  # Restrict the override to v10 consumers; verify ESLint after every update.
  minimatch@10: 11.0.5
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  smol-toml: 1.9.1
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@astrojs/cloudflare'
  - astro
  - miniflare
  - wrangler
  - '@types/node@26.5.0'
  - marked@18.0.12
  - '@cloudflare/workerd-darwin-64@1.20260921.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260921.1'
  - '@cloudflare/workerd-linux-64@1.20260921.1'
  - '@cloudflare/workerd-linux-arm64@1.20260921.1'
  - '@cloudflare/workerd-windows-64@1.20260921.1'
  - workerd@1.20260921.1
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3
  - '@astrojs/internal-helpers@0.13.1'
  - '@astrojs/markdown-satteri@0.4.7'
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - minimatch@11.0.5
