name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Workers types
        run: pnpm exec wrangler types worker-configuration.d.ts

      - name: Lint
        run: pnpm run lint

      - name: Generate Workers types and type-check
        run: pnpm run typecheck

      - name: Check migration consistency
        run: pnpm exec drizzle-kit check

      - name: Test
        run: pnpm run test

      - name: Template render tests
        run: pnpm run test:astro

      - name: Build
        run: pnpm run build

      - name: Validate Wrangler deploy config
        run: pnpm exec wrangler deploy --dry-run
